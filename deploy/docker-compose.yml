services:
  mlflow:
    image: python:3.11-slim
    container_name: datathon_mlflow
    ports:
      - "5002:5000"
    networks:
      - datathon_net
    working_dir: /tmp
    entrypoint: /bin/bash
    command:
      - -c
      - "pip install mlflow==3.15.1 --quiet && mkdir -p /tmp/artifacts && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////tmp/mlflow.db --default-artifact-root /tmp/artifacts"

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datathon_fastapi
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ENVIRONMENT=local
    depends_on:
      - mlflow
    networks:
      - datathon_net

networks:
  datathon_net:
    driver: bridge
