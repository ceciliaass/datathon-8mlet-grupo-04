version: "3.8"
services:
  mlflow:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mlflow
    container_name: datathon_mlflow
    volumes:
      - ../mlruns:/app/mlruns
      - ../mlflow.db:/app/mlflow.db
      - ..:/app:cached
    ports:
      - "5002:5000"
    environment:
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/app/mlruns
      - MLFLOW_BACKEND_STORE_URI=sqlite:////app/mlflow.db
    networks:
      - datathon_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  fastapi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.fastapi
    container_name: datathon_fastapi
    depends_on:
      - mlflow
    # compartilhando os mesmos binds para que ambos acessem mlruns e o projeto
    volumes:
      - ../mlruns:/app/mlruns
      - ../mlflow.db:/app/mlflow.db
      - ..:/app:cached
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    networks:
      - datathon_net
    # readiness: requires both the app health endpoint and MLflow reachable
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1; curl -f http://mlflow:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  datathon_net:
    name: datathon_net

volumes: {}
