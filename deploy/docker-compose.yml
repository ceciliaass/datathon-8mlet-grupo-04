services:
  mlflow:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mlflow
    container_name: datathon_mlflow
    ports:
      - "5002:5000"
    volumes:
      - ../mlflow.db:/app/mlflow.db
      - ../mlruns:/app/mlruns
    networks:
      - datathon_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.fastapi
    container_name: datathon_fastapi
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ENVIRONMENT=local
    volumes:
      - ../data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - datathon_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  datathon_net:
    driver: bridge
